{% extends "base.html" %}
{% block title %}New Invoice — Muthoinc{% endblock %}

{% block content %}
<div class="max-w-3xl">
  <h1 id="pageTitle" class="text-2xl font-bold text-slate-800 mb-1">New Invoice</h1>
  <p class="text-slate-500 text-sm mb-6">Fill in the details below and click Generate.</p>

  <!-- Campaign Name -->
  <div class="mb-6">
    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Campaign Name</label>
    <input id="campaignName" type="text" placeholder="e.g. JOOR_PROPERTY_APR2026"
           class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition bg-white"/>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

    <!-- Date range row -->
    <div class="grid grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Campaign From Date</label>
        <input id="fromDate" type="date"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Campaign To Date &amp; Time</label>
        <input id="toDate" type="datetime-local"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
      </div>
    </div>

    <!-- Client + Account ID row -->
    <div class="grid grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Client Name</label>
        <input id="clientName" type="text" placeholder="e.g. P2P &amp; WECON"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Account ID</label>
        <input id="accountId" type="text" value="{{ settings.account_id }}" placeholder="e.g. 409728473039033"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
      </div>
    </div>

    <!-- Amount + Payment + Product row -->
    <div class="grid grid-cols-3 gap-6 mb-8">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Billing Amount (USD)</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-semibold">$</span>
          <input id="billingAmount" type="number" step="0.01" min="0" placeholder="0.00"
                 class="w-full border border-slate-200 rounded-xl pl-8 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Payment Method</label>
        <select id="paymentMethod"
                class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition bg-white">
          <option value="Prepaid balance">Prepaid balance</option>
          <option value="Credit card">Credit card</option>
          <option value="Agency">Agency</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Product Type</label>
        <select id="productType"
                class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition bg-white">
          <option value="Meta ads">Meta ads</option>
          <option value="WhatsApp ads">WhatsApp ads</option>
        </select>
      </div>
    </div>

    <!-- Campaign section -->
    <div class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-sm font-semibold text-slate-700">Campaign Breakdown</h2>
          <p class="text-xs text-slate-400 mt-0.5">Auto-fill from total, or add manually</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="autoFill()"
                  class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-brand-600 text-xs font-semibold px-4 py-2 rounded-lg transition border border-indigo-100">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            Auto Fill
          </button>
          <button onclick="addCampaign()"
                  class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Campaign
          </button>
        </div>
      </div>
      <div id="campaignList" class="space-y-4"></div>
    </div>

    <!-- Remaining indicator -->
    <div id="remainingBar" class="hidden mb-6 bg-slate-50 rounded-xl px-5 py-3 flex items-center justify-between">
      <span class="text-xs text-slate-500">Unallocated amount</span>
      <span id="remainingAmt" class="text-sm font-bold text-slate-700">$0.00</span>
    </div>

    <!-- Generate button -->
    <button onclick="generateInvoice()"
            class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2" id="genBtn">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      Generate & Download PDF
    </button>

  </div>

  <!-- Success toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white text-sm px-5 py-3 rounded-xl shadow-xl flex items-center gap-3">
    <svg class="w-5 h-5 text-green-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toastMsg">Invoice generated!</span>
  </div>
</div>

<script>
// ── Impression ↔ Amount sync ──────────────────────────────────────────────────
const CPM = 5.5; // $5.50 per 1000 impressions

function amtToImp(amt) { return Math.round((amt / CPM) * 1000); }

function onAmtChange(el) {
  const row = el.closest('[id^="ad_"]');
  if (row) row.querySelector('.ad-imp').value = amtToImp(parseFloat(el.value) || 0);
  updateRemaining();
}

// ── Redistribute total across all ad sets after add / remove ─────────────────
function redistribute() {
  const total = parseFloat(document.getElementById("billingAmount").value) || 0;
  if (!total) return;
  const rows = [...document.querySelectorAll('[id^="ad_"]')].filter(r => r.querySelector('.ad-amt'));
  if (!rows.length) return;

  const n = rows.length;
  const curAmts = rows.map(r => parseFloat(r.querySelector('.ad-amt').value) || 0);
  const curSum  = curAmts.reduce((a,b)=>a+b, 0);

  let newAmts;
  if (curSum > 0.01) {
    newAmts = curAmts.map(a => Math.round((a / curSum) * total * 100) / 100);
  } else {
    const eq = Math.round((total / n) * 100) / 100;
    newAmts  = rows.map(() => eq);
  }
  // Fix rounding drift on last item
  const drift = Math.round((total - newAmts.reduce((a,b)=>a+b,0)) * 100) / 100;
  newAmts[n-1] = Math.round((newAmts[n-1] + drift) * 100) / 100;

  rows.forEach((row, i) => {
    row.querySelector('.ad-amt').value = newAmts[i].toFixed(2);
    row.querySelector('.ad-imp').value = amtToImp(newAmts[i]);
  });
  updateRemaining();
}

// ── Auto-fill data pools ──────────────────────────────────────────────────────
const CAMP_TEMPLATES = [
  {
    name: "F1_WHT_CAMPAIGN",
    adSets: ["ADS1_CUSTOM", "INTEST BASE", "ADS1_CUSTOM – Copy", "ADS_LAL_FT"]
  },
  {
    name: "F1_LEAD_CAMPAIGN",
    adSets: ["ADS1_LAL_LPV", "ADS1_LAL_LPV_IOS", "LEAD_BROAD_TA"]
  },
  {
    name: "WEB_RECOMMENDATION_TA",
    adSets: ["New Traffic Ad set with recommended settings", "RETARGETING_30D", "LAL_2PCT_WEB"]
  },
  {
    name: "CONVERSION_CAMPAIGN",
    adSets: ["CUSTOM_AUD_7D", "PURCHASE_LAL_1PCT", "BROAD_CONV_TA"]
  },
  {
    name: "AWARENESS_BROAD",
    adSets: ["INTEST_BROAD", "LAL_FT_AWARENESS", "VIDEO_VIEW_TA"]
  }
];

function rand(min, max) { return Math.random() * (max - min) + min; }

// Distribute total into N parts that sum exactly to total (2 decimals)
function distribute(total, n) {
  const weights = Array.from({length: n}, () => rand(0.5, 1.5));
  const sum = weights.reduce((a, b) => a + b, 0);
  const parts = weights.map(w => Math.round((w / sum) * total * 100) / 100);
  // Fix rounding drift on last element
  const diff = Math.round((total - parts.reduce((a,b)=>a+b,0)) * 100) / 100;
  parts[parts.length - 1] = Math.round((parts[parts.length - 1] + diff) * 100) / 100;
  return parts;
}

// Estimate impressions from spend (CPM $3–$9 range)
function impressionsFromSpend(spend) {
  const cpm = rand(3, 9);
  return Math.round((spend / cpm) * 1000);
}

function autoFill() {
  const total = parseFloat(document.getElementById("billingAmount").value);
  if (!total || total <= 0) {
    alert("Enter a billing amount first, then click Auto Fill.");
    return;
  }

  // Clear existing
  document.getElementById("campaignList").innerHTML = "";
  campId = 0; adId = 0;
  document.getElementById("remainingBar").classList.remove("hidden");

  // Pick 2–3 random campaigns
  const shuffled = [...CAMP_TEMPLATES].sort(() => Math.random() - 0.5);
  const numCamps  = total < 20 ? 1 : total < 60 ? 2 : 3;
  const picked    = shuffled.slice(0, numCamps);

  // Distribute total across campaigns
  const campAmounts = distribute(total, numCamps);

  picked.forEach((tpl, ci) => {
    const cid = ++campId;
    const div = document.createElement("div");
    div.id = `camp_${cid}`;
    div.className = "border border-slate-200 rounded-xl p-5 bg-slate-50";
    div.innerHTML = `
      <div class="flex items-center gap-3 mb-4">
        <input type="text" value="${tpl.name}"
               class="flex-1 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition camp-name"/>
        <button onclick="removeCampaign(${cid})" class="text-slate-400 hover:text-red-500 transition p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="adsets_${cid}" class="space-y-2 mb-3"></div>
      <button onclick="addAdSet(${cid})"
              class="text-xs text-brand-600 font-semibold hover:text-brand-700 flex items-center gap-1 transition">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add Ad Set
      </button>
    `;
    document.getElementById("campaignList").appendChild(div);

    // Pick 2–3 ad sets for this campaign
    const numAds   = Math.min(tpl.adSets.length, total < 20 ? 1 : Math.floor(rand(2, 4)));
    const adNames  = tpl.adSets.slice(0, numAds);
    const adAmts   = distribute(campAmounts[ci], numAds);

    adNames.forEach((adName, ai) => {
      const aid = ++adId;
      const container = document.getElementById(`adsets_${cid}`);
      const row = document.createElement("div");
      row.id = `ad_${aid}`;
      row.className = "grid grid-cols-12 gap-2 items-center";
      const imp = impressionsFromSpend(adAmts[ai]);
      row.innerHTML = `
        <input type="text" value="${adName}"
               class="col-span-5 border border-slate-200 bg-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition ad-name"/>
        <input type="number" value="${imp}" min="0"
               class="col-span-3 border border-slate-200 bg-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition ad-imp"/>
        <div class="col-span-3 relative">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">$</span>
          <input type="number" step="0.01" value="${adAmts[ai].toFixed(2)}" min="0" oninput="onAmtChange(this)"
                 class="w-full border border-slate-200 bg-white rounded-lg pl-5 pr-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition ad-amt"/>
        </div>
        <button onclick="document.getElementById('ad_${aid}').remove(); redistribute();"
                class="col-span-1 text-slate-300 hover:text-red-400 transition flex justify-center">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      `;
      container.appendChild(row);
    });
  });

  updateRemaining();
}

// ── Manual campaign helpers ───────────────────────────────────────────────────
let campId = 0;

function addCampaign() {
  const id = ++campId;
  const div = document.createElement("div");
  div.id = `camp_${id}`;
  div.className = "border border-slate-200 rounded-xl p-5 bg-slate-50";
  div.innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      <input type="text" placeholder="Campaign name" onchange="updateRemaining()"
             class="flex-1 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition camp-name"/>
      <button onclick="removeCampaign(${id})" class="text-slate-400 hover:text-red-500 transition p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="adsets_${id}" class="space-y-2 mb-3"></div>
    <button onclick="addAdSet(${id})"
            class="text-xs text-brand-600 font-semibold hover:text-brand-700 flex items-center gap-1 transition">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Add Ad Set
    </button>
  `;
  document.getElementById("campaignList").appendChild(div);
  document.getElementById("remainingBar").classList.remove("hidden");
  addAdSet(id);
  redistribute();
}

function removeCampaign(id) {
  document.getElementById(`camp_${id}`).remove();
  if (!document.getElementById("campaignList").children.length)
    document.getElementById("remainingBar").classList.add("hidden");
  redistribute();   // auto-adjust remaining campaigns to fill the total
}

let adId = 0;
function addAdSet(campId, prefillAmt) {
  const id  = ++adId;
  const total    = parseFloat(document.getElementById("billingAmount").value) || 0;
  let allocated  = 0;
  document.querySelectorAll(".ad-amt").forEach(el => allocated += parseFloat(el.value) || 0);
  const remaining = Math.max(0, Math.round((total - allocated) * 100) / 100);
  const startAmt  = prefillAmt !== undefined ? prefillAmt : remaining;
  const startImp  = startAmt > 0 ? amtToImp(startAmt) : "";

  const container = document.getElementById(`adsets_${campId}`);
  const row = document.createElement("div");
  row.id = `ad_${id}`;
  row.className = "grid grid-cols-12 gap-2 items-center";
  row.innerHTML = `
    <input type="text" placeholder="Ad set name"
           class="col-span-5 border border-slate-200 bg-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition ad-name"/>
    <input type="number" value="${startImp}" placeholder="Impressions" min="0"
           class="col-span-3 border border-slate-200 bg-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition ad-imp"/>
    <div class="col-span-3 relative">
      <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">$</span>
      <input type="number" step="0.01" min="0" value="${startAmt > 0 ? startAmt.toFixed(2) : ''}" placeholder="0.00"
             oninput="onAmtChange(this)"
             class="w-full border border-slate-200 bg-white rounded-lg pl-5 pr-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 transition ad-amt"/>
    </div>
    <button onclick="document.getElementById('ad_${id}').remove(); redistribute();"
            class="col-span-1 text-slate-300 hover:text-red-400 transition flex justify-center">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  `;
  container.appendChild(row);
  updateRemaining();
}

function updateRemaining() {
  const total = parseFloat(document.getElementById("billingAmount").value) || 0;
  let allocated = 0;
  document.querySelectorAll(".ad-amt").forEach(el => allocated += parseFloat(el.value) || 0);
  const remaining = total - allocated;
  const el = document.getElementById("remainingAmt");
  el.textContent = `$${remaining.toFixed(2)}`;
  el.className = remaining < -0.01 ? "text-sm font-bold text-red-500" : "text-sm font-bold text-slate-700";
}

document.getElementById("billingAmount").addEventListener("input", updateRemaining);

document.getElementById("campaignName").addEventListener("input", function() {
  document.getElementById("pageTitle").textContent = this.value.trim() || "New Invoice";
});

// Pre-fill date range: yesterday → now
(function() {
  const now  = new Date();
  const yest = new Date(now); yest.setDate(yest.getDate() - 1);
  const pad  = n => String(n).padStart(2,"0");
  document.getElementById("fromDate").value =
    `${yest.getFullYear()}-${pad(yest.getMonth()+1)}-${pad(yest.getDate())}`;
  document.getElementById("toDate").value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
})();

async function generateInvoice() {
  const clientName = document.getElementById("clientName").value.trim();
  const amount     = parseFloat(document.getElementById("billingAmount").value);

  if (!clientName) { alert("Please enter a client name."); return; }
  if (!amount || amount <= 0) { alert("Please enter a valid billing amount."); return; }

  const campaigns = [];
  document.querySelectorAll("#campaignList > div").forEach(campEl => {
    const name = campEl.querySelector(".camp-name")?.value.trim();
    if (!name) return;
    const ad_sets = [];
    campEl.querySelectorAll("[id^='ad_']").forEach(adEl => {
      const aName = adEl.querySelector(".ad-name")?.value.trim();
      const aImp  = adEl.querySelector(".ad-imp")?.value;
      const aAmt  = adEl.querySelector(".ad-amt")?.value;
      if (aName) ad_sets.push({ name: aName, impressions: parseInt(aImp)||0, amount: parseFloat(aAmt)||0 });
    });
    if (ad_sets.length) campaigns.push({ name, ad_sets });
  });

  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Generating...`;

  try {
    const res  = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        client_name:    clientName,
        account_id:     document.getElementById("accountId").value.trim(),

        amount,
        payment_method: document.getElementById("paymentMethod").value,
        product_type:   document.getElementById("productType").value,
        campaigns,
        from_date:      document.getElementById("fromDate").value,
        to_date:        document.getElementById("toDate").value,
      })
    });
    const data = await res.json();

    if (data.success) {
      window.open(`/view/${data.filename}`, "_blank");
      showToast(`Invoice ${data.invoice_number} ready!`);
      // redirect back to product page after short delay
    } else {
      alert("Error: " + (data.error || "Something went wrong."));
    }
  } catch(e) {
    alert("Network error. Is the server running?");
  }

  btn.disabled = false;
  btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Generate & Download PDF`;
}

async function saveWithPicker(filename) {
  const res  = await fetch(`/download/${filename}`);
  const blob = await res.blob();

  // Use native Save As dialog if browser supports it
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: "PDF File", accept: { "application/pdf": [".pdf"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    } catch (e) {
      if (e.name === "AbortError") return; // user cancelled — do nothing
    }
  }
  // Fallback: trigger normal browser download
  const url = URL.createObjectURL(blob);
  const a   = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 4000);
}
</script>
{% endblock %}
