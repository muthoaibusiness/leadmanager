{% extends "base.html" %}
{% block title %}Settings — Muthoinc{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-slate-800 mb-1">Settings</h1>
  <p class="text-slate-500 text-sm mb-8">Customize your company branding shown on every invoice.</p>

  <!-- Logo upload -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6 mb-6">
    <h2 class="text-sm font-semibold text-slate-700 mb-4">Company Logo</h2>

    <div class="flex items-center gap-6">
      <div class="w-24 h-24 rounded-xl border-2 border-dashed border-slate-200 flex items-center justify-center bg-slate-50 overflow-hidden flex-shrink-0">
        {% if settings.logo_path %}
          <img src="/static/uploads/{{ settings.logo_path.split('/')[-1] }}"
               class="w-full h-full object-contain p-2" id="logoPreview" alt="logo"/>
        {% else %}
          <svg class="w-8 h-8 text-slate-300" id="logoIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <img src="" class="w-full h-full object-contain p-2 hidden" id="logoPreview" alt="logo"/>
        {% endif %}
      </div>

      <div class="flex-1">
        <form method="POST" action="/settings/logo" enctype="multipart/form-data">
          <label class="block">
            <span class="text-xs text-slate-500 block mb-2">PNG, JPG, WEBP · max 5 MB</span>
            <input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp" onchange="previewLogo(this)"
                   class="block w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 transition"/>
          </label>
          <button type="submit"
                  class="mt-3 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
            Upload Logo
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Company details -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6">
    <h2 class="text-sm font-semibold text-slate-700 mb-5">Company Details</h2>
    <form method="POST" action="/settings/save" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Company Name</label>
        <input name="company_name" type="text" value="{{ settings.company_name }}"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Company Address</label>
        <input name="company_address" type="text" value="{{ settings.company_address }}"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">VAT / Tax Reg. Number</label>
        <input name="company_vat" type="text" value="{{ settings.company_vat }}"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Account ID <span class="text-slate-400 normal-case font-normal">(shown on invoice header)</span></label>
        <input name="account_id" type="text" value="{{ settings.account_id }}"
               class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition font-mono"/>
      </div>

      <button type="submit"
              class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition text-sm">
        Save Changes
      </button>
    </form>
  </div>
</div>

<script>
function previewLogo(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      const preview = document.getElementById("logoPreview");
      const icon    = document.getElementById("logoIcon");
      preview.src = e.target.result;
      preview.classList.remove("hidden");
      if (icon) icon.classList.add("hidden");
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
