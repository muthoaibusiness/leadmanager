<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Muthoinc Invoices{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff', 100:'#e0e7ff', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition-all text-sm font-medium; }
    .sidebar-link.active { @apply text-white bg-brand-600; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-60 min-h-screen bg-slate-900 flex flex-col fixed top-0 left-0 z-10">
    <!-- Logo area -->
    <div class="px-5 py-5 border-b border-slate-700">
      <!-- Clickable logo upload zone -->
      <form method="POST" action="/settings/logo" enctype="multipart/form-data" id="sidebarLogoForm">
        <label class="block cursor-pointer group mb-3" title="Click to upload logo">
          <input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp" class="hidden"
                 onchange="document.getElementById('sidebarLogoForm').submit()"/>
          <div class="w-full h-14 rounded-xl border-2 border-dashed border-slate-600 group-hover:border-brand-500 flex items-center justify-center overflow-hidden transition relative">
            {% if settings.logo_path %}
              <img src="/static/uploads/{{ settings.logo_path.split('/')[-1] }}"
                   class="h-12 object-contain px-2" alt="logo"/>
              <div class="absolute inset-0 bg-slate-900/70 opacity-0 group-hover:opacity-100 transition flex items-center justify-center rounded-xl">
                <span class="text-white text-xs font-semibold">Change Logo</span>
              </div>
            {% else %}
              <div class="text-center">
                <svg class="w-5 h-5 text-slate-500 mx-auto mb-0.5 group-hover:text-brand-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <p class="text-slate-500 text-xs group-hover:text-brand-400 transition">Upload Logo</p>
              </div>
            {% endif %}
          </div>
        </label>
      </form>
      <p class="text-white font-bold text-lg leading-tight">{{ settings.company_name }}</p>
      <p class="text-slate-400 text-xs mt-0.5">Invoice Manager</p>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-5 space-y-1">
      <a href="/" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        New Invoice
      </a>
      <a href="/history" class="sidebar-link {% if request.path == '/history' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
        </svg>
        Invoice History
      </a>
      <a href="/settings" class="sidebar-link {% if request.path == '/settings' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Settings
      </a>
    </nav>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-slate-700">
      <p class="text-slate-500 text-xs">VAT: {{ settings.company_vat }}</p>
      <p class="text-slate-500 text-xs">{{ settings.company_address }}</p>
    </div>
  </aside>

  <!-- Main content -->
  <main class="ml-60 flex-1 p-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
