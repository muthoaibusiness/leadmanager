<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Available Units: phone demo after the train seat picker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<style>
/* ds-allow-hardcode:start  throwaway mockup; values mirror src/index.css theme tokens */
.dark{--bg:#000;--surf2:#1d1d1d;--t1:#fff;--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.42);--bd:rgba(255,255,255,.12);--accent:#54B848;--on-acc:#0a0a0a}
.light{--bg:#FAFAFA;--surf2:#EFEFEF;--t1:#0A0A0A;--t2:rgba(10,10,10,.64);--t3:rgba(10,10,10,.44);--bd:rgba(10,10,10,.12);--accent:#2E7D27;--on-acc:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2a2a;font:400 14px/1.35 Inter,sans-serif;padding:24px;display:flex;gap:28px;width:max-content}
.mi{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-style:normal;display:inline-block}
.lab{font:600 13px/1.3 'Space Grotesk',Inter,sans-serif;color:#ddd;margin-bottom:10px;max-width:412px}
.phone{width:412px;height:1240px;border-radius:34px;background:var(--bg);color:var(--t1);overflow:hidden;position:relative;padding:20px 16px 90px}
.hd{display:flex;align-items:center;gap:12px;height:48px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center}
.hd h1{flex:1;font:600 20px/1.2 'Space Grotesk',Inter,sans-serif}
.vt{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--surf2)}
.vt span{width:40px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--t2)}
.vt span.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pj{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px}
.pj b{font:600 18px 'Space Grotesk',Inter,sans-serif}
.pj em{font:600 14px Inter;font-style:normal;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surf2);border-radius:14px;padding:14px 14px 12px}
.card b{display:block;font:600 24px/1 'Space Grotesk',Inter,sans-serif}
.card span{display:block;margin-top:8px;font:500 13.5px Inter;color:var(--t2)}
.chips{display:flex;gap:6px;margin-top:16px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chip{flex:none;height:32px;padding:0 11px;border:1px solid var(--bd);border-radius:999px;display:flex;align-items:center;gap:6px;font:500 12.5px Inter;color:var(--t2)}
.chip b{color:var(--t1)}.chip.on{border-color:var(--accent);color:var(--t1)}
.dot{width:7px;height:7px;border-radius:50%}
/* section heads, like the train's "Select Coach · THA Selected" */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sh b{font:600 16px 'Space Grotesk',Inter,sans-serif}
.sh span{font:500 13px Inter;color:var(--t2)}
/* floors as a row, like the coaches: free floor = green outline, picked = solid, no units = dashed */
.floors{display:flex;gap:6px}
.fl{flex:1;height:42px;border-radius:10px;display:grid;place-items:center;font:600 12px Inter;border:1.5px solid color-mix(in srgb,var(--accent) 65%,transparent);color:var(--t1)}
.fl.full{border-color:transparent;background:color-mix(in srgb,#E8912F 24%,var(--bg));color:color-mix(in srgb,#E8912F 45%,var(--t1))}
.fl.none{border:1.5px dashed var(--bd);color:var(--t3)}
.fl.sel{background:var(--t1);border-color:var(--t1);color:var(--bg)}
/* legend (A only: the tiles no longer match the chip dots) */
.lg{display:flex;gap:14px;margin:-2px 0 10px;font:500 12px Inter;color:var(--t2)}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* units: 6 a row */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.t{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px solid transparent;
  background:color-mix(in srgb,var(--c) 24%,var(--bg));color:color-mix(in srgb,var(--c) 45%,var(--t1))}
.t b{font:600 12px/1 'Space Grotesk',Inter,sans-serif}
.t small{font:500 9.5px/1 Inter}
.t.av{background:color-mix(in srgb,var(--accent) 9%,transparent);border-color:color-mix(in srgb,var(--accent) 65%,transparent);color:var(--t1)}
.t.av small{color:var(--t2)}
.t.sel{background:var(--t1);border-color:var(--t1);color:var(--bg)}
.t.sel small{color:inherit;opacity:.8}
.rsv{position:absolute;left:16px;right:16px;bottom:18px;height:52px;border-radius:999px;background:var(--accent);color:var(--on-acc);display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px 'Space Grotesk',Inter,sans-serif;letter-spacing:.12em}
/* ds-allow-hardcode:end */
</style></head>
<body><!-- ds-allow-hardcode:start -->
<script>
// ds-allow-hardcode:start
// Real data: Citizen Avenue Mall, from the app's seed (1st floor picked).
const U = [["S-101","land",1221],["S-102","land",715],["S-103","av",387],["S-104","av",251],["S-105","av",162],["S-106","av",1113],["S-107","av",202],["S-108","av",245],["S-109","av",336],["S-110","av",264],["S-111","av",245],["S-112","av",208],["S-113","av",202],["S-114","av",231],["S-115","av",225],["S-116","hold",204],["S-117","hold",206],["S-118","land",134],["S-119","land",202],["S-120","land",156],["S-121","land",170],["S-122","land",175],["S-123","land",175],["S-124","land",285],["S-125","land",120],["S-126","land",156],["S-127","av",205],["S-128","av",200],["S-129","av",210],["S-130","av",286],["S-131","av",181],["S-132","av",125],["S-133","av",122],["S-134","av",160],["S-135","av",204],["S-136","hold",171],["S-137","hold",190],["S-138","land",181],["S-139","land",286],["S-140","land",325],["S-141","land",131],["S-142","land",169],["S-143","av",216],["S-144","hold",236],["S-145","av",165],["S-146","av",215],["S-147","land",236]];
const F = [["B","Basement",0,0],["SB","Semi Basement",3,14],["GF","Ground Floor",17,40],["1F","1st Floor",25,47],["2F","2nd Floor",27,49],["3F","3rd Floor",27,49],["4F","4th Floor",27,49],["5F","5th Floor",13,21]];
const OWN = { hold: '#E3A322', sold: '#D23C3C', land: '#A78BFA', resv: '#38BDF8' }, WARM = '#E8912F';
function phone(theme, v, label) {
  const color = (k) => v === 'A' ? WARM : OWN[k];
  const floors = F.map(([s, n, free, all]) => `<span class="fl${s === '1F' ? ' sel' : !all ? ' none' : !free ? ' full' : ''}" title="${n}">${s}</span>`).join('');
  const tiles = U.map(([c, k, sz]) => `<span class="t ${k}${c === 'S-113' ? ' sel' : ''}" style="--c:${color(k)}"><b>${c}</b><small>${sz.toLocaleString('en-IN')} sft</small></span>`).join('');
  const legend = v === 'A' ? `<div class="lg"><span><i style="border:1.5px solid var(--accent)"></i>Available</span><span><i style="background:var(--t1)"></i>Picked</span><span><i style="background:color-mix(in srgb,${WARM} 24%,var(--bg))"></i>Taken</span></div>` : '';
  document.body.insertAdjacentHTML('beforeend', `<div><div class="lab">${label}</div><div class="phone ${theme}">
    <div class="hd"><span class="back"><span class="mi">chevron_left</span></span><h1>Available Units</h1><div class="vt"><span class="on"><span class="mi">grid_on</span></span><span><span class="mi">format_list_bulleted</span></span></div></div>
    <div class="pj"><b>CITIZEN AVENUE MALL</b><em>25 available</em></div>
    <div class="cards"><div class="card"><b>47</b><span>All</span></div><div class="card"><b>25</b><span>Available</span></div><div class="card"><b>5</b><span>On hold</span></div></div>
    <div class="chips"><span class="chip on">All <b>47</b></span><span class="chip"><i class="dot" style="background:var(--accent)"></i>Available <b>25</b></span><span class="chip"><i class="dot" style="background:${color('hold')}"></i>On hold <b>5</b></span><span class="chip"><i class="dot" style="background:${color('sold')}"></i>Sold <b>0</b></span><span class="chip"><i class="dot" style="background:${color('land')}"></i>Landowner <b>17</b></span></div>
    <div class="sh"><b>Floor</b><span>1st Floor · 25 of 47 free</span></div>
    <div class="floors">${floors}</div>
    <div class="sh"><b>Units</b><span>S-113 picked</span></div>
    ${legend}<div class="tiles">${tiles}</div>
    <div class="rsv"><span class="mi">send</span>RESERVE NOW</div></div></div>`);
}
phone('light', 'A', 'A · light. Every taken unit one soft warm colour, like the train\'s Booked');
phone('dark', 'A', 'A · dark');
phone('light', 'B', 'B · light. Each status keeps its own soft colour, as the chip dots');
// ds-allow-hardcode:end
</script>
<!-- ds-allow-hardcode:end -->
</body></html>
